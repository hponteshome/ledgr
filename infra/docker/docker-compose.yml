# infra/docker/docker-compose.yml
#
# RECRIADO em 16/08/2026 - o arquivo original estava corrompido desde o
# commit inicial do projeto (continha conteudo de scripts/fix-existing-accounts.ts
# em vez de config docker-compose valida). Ver LEDGR-contexto.md, secao
# "INCIDENTE CRITICO (16/08/2026)" para o contexto completo.
#
# Os volumes abaixo sao EXTERNAL (external: true) apontando para os volumes
# anonimos que ja existem e contem os dados reais do ambiente - isso e
# DELIBERADO, para nao criar volumes novos vazios e nao arriscar perda de
# dados adicional. NUNCA remover "external: true" nem trocar o "name:" sem
# confirmar antes com docker volume inspect.
#
# ALERTA DE SEGURANCA (aceito para ambiente local, NAO usar em producao):
# credenciais do Postgres estao em texto claro abaixo. Antes de qualquer
# deploy em producao, migrar para variaveis de ambiente (.env, nao commitado)
# ou um gerenciador de segredos.

services:
  postgres:
    image: postgres:16
    container_name: ledgr-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ledgr
      POSTGRES_PASSWORD: ledgr123
      POSTGRES_DB: ledgr_app
    ports:
      - "5432:5432"
    volumes:
      - ledgr_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ledgr-redis
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "6379:6379"
    volumes:
      - ledgr_redis_data:/data

volumes:
  ledgr_postgres_data:
    external: true
    name: 06d621c5fbd0fcaae7c4eed16a07e8e553c4b9433df49126142e78341c08cb6f
  ledgr_redis_data:
    external: true
    name: 9cb64c618f1e580ceacfc7741b14eb6b88f0ac7cae74a3d2147df0d716f87480